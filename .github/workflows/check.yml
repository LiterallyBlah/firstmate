name: Checks
on: [push, pull_request]
jobs:
  deck-review:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix docs/board-list
      - run: node docs/attention-deck/render.mjs
      - run: node docs/fm-ui-polish/render.mjs
      - run: node docs/deck-scene-swap/render.mjs
      - run: node docs/decision-ux-lists/render.mjs
      - run: node docs/smooth-pr2/render.mjs
      - run: node docs/smooth-pr2/regressions.mjs
      - run: node docs/smooth-pr2/contact-sheets.mjs
      - run: node docs/smooth-pr5/render.mjs
      - run: node docs/smooth-pr9/render.mjs
      - run: node docs/smooth-pr10/render.mjs
      # The reviewed D8 before snapshot predates rebases and is no longer in branch history.
      - run: git fetch origin de4dac1be70736cf0a0f417244f9ab895ed5354d
      - run: node docs/smooth-pr10/render-delayed.mjs
      - run: node docs/smooth-pr10/render-drawer.mjs
      - run: node docs/smooth-pr10/render-quiet.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: deck-before-after
          path: |
            .local/attention-deck/*.png
            .local/attention-deck/results.json
            .local/fm-ui-polish/*.png
            .local/fm-ui-polish/results.json
            .local/deck-scene-swap/worktree/*.png
            .local/deck-scene-swap/worktree/results.json
            .local/decision-ux-lists/*.png
            .local/decision-ux-lists/results.json
            .local/smooth-pr2/ui/*.png
            .local/smooth-pr2/ui/*.json
            .local/smooth-pr2/ui/screenshots/*.png
            .local/smooth-pr2/regressions/results.json
            .local/smooth-pr2/regressions/screenshots/*.png
            .local/smooth-pr5/ui/results.json
            .local/smooth-pr5/ui/screenshots/*.png
            .local/smooth-pr9/ui/results.json
            .local/smooth-pr9/ui/screenshots/*.png
            .local/smooth-pr10/ui/results.json
            .local/smooth-pr10/ui/screenshots/*.png
            .local/smooth-pr10/delayed/*.png
            .local/smooth-pr10/delayed/results.json
            .local/smooth-pr10/drawer/*.png
            .local/smooth-pr10/drawer/results.json
            .local/smooth-pr10/quiet/*.png
            .local/smooth-pr10/quiet/results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Hosted Windows runners slow down at random, on both workers at once: across 61 Windows reports (main and
      # PRs 171-176, 2026-10-28/29) sub-2 s tests passed after up to ~37 s and heavy fixtures ~46 s beyond their
      # median, and 20 s timed out default-timeout tests. On Windows only, the default becomes 60 s (slowest
      # default-timeout test ~13 s + the largest excess). Same-machine timings of main and 833d557a match, so it is not
      # a code regression. Every assertion is unchanged; Ubuntu keeps the 5 s default as the timing sentinel.
      # Retain the qualified S02 two-worker budget.
      - run: npm test -- --maxWorkers=2 --reporter=default --reporter=json --outputFile=.local/s01/ci-tests.json ${{ matrix.os == 'windows-latest' && '--testTimeout=60000' || '' }}
        env:
          # Test setup must override an enabled journal on developer machines.
          FIRSTMATE_RECEIPT_JOURNAL: "1"
          # Bounded observations for named Windows failures (test/ci-diagnostics.ts); inert when unset.
          FIRSTMATE_CI_DIAGNOSTICS: .local/ci-diagnostics
          # S06 exports metadata-only synthetic routing/baseline evidence for this checkout.
          FIRSTMATE_PILOT_EVIDENCE: "1"
          FIRSTMATE_PILOT_SOURCE_HEAD: ${{ github.sha }}
      - run: npm ci --prefix docs/board-list
      - run: npx --prefix docs/board-list playwright install --with-deps chromium
      - run: node docs/needs-you/render.mjs
      - run: node docs/scoped-supervision/s05-ui/render.mjs
      - run: node docs/scoped-supervision/build-c-ui/render.mjs
      - run: node docs/smooth-pr8/render.mjs
      - run: node docs/smooth-rollout/render.mjs
      - run: node docs/smooth-rollout/review-regressions.mjs
      - run: node docs/scoped-supervision/build-b-ui/render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: needs-you-render-${{ matrix.os }}
          path: |
            .local/needs-you-drawer/*.png
            .local/needs-you-drawer/*.json
            .local/s05-ui/*.png
            .local/s05-ui/results.json
            .local/build-c/ui/*.png
            .local/build-c/ui/results.json
            .local/smooth-pr8/ui/screenshots/*.png
            .local/smooth-pr8/ui/results.json
            .local/smooth-rollout/screenshots/*.png
            .local/smooth-rollout/results.json
            .local/smooth-rollout-review/after/screenshots/*.png
            .local/smooth-rollout-review/after/independent-results.json
            .local/build-b-ui/*.png
            .local/build-b-ui/results.json
            .local/s01/ci-tests.json
            .local/ci-diagnostics/*.json
            .local/s06/*.json
          include-hidden-files: true
